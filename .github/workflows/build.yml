name: Build APK Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Find project (unzip if needed)
        run: |
          if [ -f project.godot ]; then
            echo "PROJ=." >> $GITHUB_ENV
          else
            Z=$(find . -maxdepth 2 -name "*.zip" | head -1)
            echo "Using zip: $Z"
            mkdir -p _game
            unzip -q "$Z" -d _game
            echo "PROJ=$(dirname "$(find _game -name project.godot | head -1)")" >> $GITHUB_ENV
          fi

      - name: Setup Godot, templates, keystore
        run: |
          cd "$PROJ"
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot build
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          godot -v -e --quit --headless || true
          JAVA_DIR="${JAVA_HOME:-$(dirname $(dirname $(readlink -f $(which javac))))}"
          echo "Java dir: $JAVA_DIR"
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
            cat > ~/.config/godot/$f <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/shutdown_adb_on_exit = true
          EOF
          done
          ls ~/.config/godot/
          head -5 ~/.config/godot/editor_settings-4.3.tres

      - name: Run rule tests
        run: |
          cd "$PROJ"
          godot --headless -s tests/test_anti_stack.gd

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd "$PROJ"
          godot --headless --verbose --export-debug "Android" build/LudoKing3D.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Ludo King 3D v1.${{ github.run_number }}
          files: ${{ env.PROJ }}/build/LudoKing3D.apk
